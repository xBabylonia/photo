<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff477e">
<title>Disposable Camera Photobooth</title>
<style>
:root{
  --pink:#ff477e;--yellow:#ffd166;--cyan:#70d6ff;--green:#06d6a0;
  --purple:#8338ec;--ink:#241f20;--paper:#fffaf4;--muted:#756d6b;
  --body:#ff477e;--body2:#ff7a59;--frame:#fffaf4;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 12% 15%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 85% 22%,#fff 0 2px,transparent 3px),
    linear-gradient(135deg,#ffcad4,#ffd166 48%,#70d6ff);
  background-size:42px 42px,55px 55px,100% 100%;
  min-height:100vh;padding:16px;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1240px;margin:auto}
header{text-align:center;margin:4px auto 18px}
h1{margin:0;font-size:clamp(1.8rem,5vw,3.2rem);letter-spacing:-2px}
.subtitle{margin:6px 0;color:#4f4747;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(280px,540px) 1fr;gap:18px;align-items:start}
.camera-shell{
  background:linear-gradient(145deg,var(--body),var(--body2));
  border:5px solid #221d1f;border-radius:35px;padding:16px;
  box-shadow:10px 12px 0 #221d1f,0 18px 35px #0003;
  position:relative;overflow:hidden;
}
.camera-shell:before{
  content:"";position:absolute;inset:9px;border:2px dashed #fff8;border-radius:27px;pointer-events:none
}
.brand{display:flex;align-items:center;justify-content:space-between;color:white;font-weight:900;position:relative;z-index:1}
.brand span:first-child{font-size:1.2rem;letter-spacing:2px}
.brand small{background:#221d1f;padding:5px 8px;border-radius:8px}
.top-controls{display:flex;gap:8px;align-items:center;position:relative;z-index:1}
.lens{
  width:44px;height:44px;border-radius:50%;border:4px solid #221d1f;
  background:radial-gradient(circle at 35% 30%,#fff 0 8%,#70d6ff 10% 25%,#164e63 28% 53%,#111 55%);
}
.viewfinder{
  aspect-ratio:4/3;background:#111;border:8px solid #221d1f;border-radius:18px;
  overflow:hidden;position:relative;margin:17px 7px 12px;box-shadow:inset 0 0 0 2px #fff5;
}
#video{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(1)}
#video.mirrored{transform:scaleX(-1)}
#viewCanvas{display:none}
.grid-overlay{position:absolute;inset:0;display:none;pointer-events:none}
.grid-overlay.show{display:block;background:
 linear-gradient(90deg,transparent 32.8%,#fff9 33%,transparent 33.4%,transparent 66.1%,#fff9 66.4%,transparent 66.8%),
 linear-gradient(0deg,transparent 32.8%,#fff9 33%,transparent 33.4%,transparent 66.1%,#fff9 66.4%,transparent 66.8%)}
.viewfinder-status{
 position:absolute;left:10px;right:10px;bottom:8px;color:white;background:#000a;
 border-radius:8px;padding:5px;font-size:.75rem;text-align:center;display:none
}
.viewfinder-status.show{display:block}
.flash-light{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
.flash-light.fire{animation:flash .42s ease-out}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
.camera-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.shutter{
 width:92px;height:92px;border-radius:50%;border:7px solid #221d1f;background:#fff;
 box-shadow:0 5px 0 #bbb,0 8px 0 #221d1f;font-weight:900;color:#221d1f;
 transition:.12s;flex:none
}
.shutter:active,.shutter.pressed{transform:translateY(5px);box-shadow:0 2px 0 #bbb,0 3px 0 #221d1f}
.shutter:disabled{opacity:.45;cursor:not-allowed}
.counter{
 background:#221d1f;color:#ffd166;border:3px solid #ffd166;border-radius:9px;
 padding:7px 10px;text-align:center;font-family:monospace;font-weight:bold;min-width:105px
}
.counter strong{display:block;font-size:1.55rem}
.wind{color:white;text-align:center;font-size:.7rem}
.wind i{display:block;width:42px;height:42px;border:5px dotted white;border-radius:50%;margin:auto}
.wind.spinning i{animation:spin .55s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.little-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;position:relative;z-index:1}
.pill,.control-btn{
 border:2px solid #221d1f;border-radius:999px;background:#fff;color:#221d1f;
 padding:8px 11px;font-weight:800;box-shadow:3px 3px 0 #221d1f
}
.pill.active,.control-btn.active{background:#ffd166}
.control-btn:active,.pill:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #221d1f}
.panel{
 background:#fffaf4eF;border:4px solid #241f20;border-radius:22px;padding:16px;
 box-shadow:7px 8px 0 #241f20
}
.panel h2{margin:0 0 12px;font-size:1.15rem}
.panel + .panel{margin-top:15px}
.controls-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
label{font-weight:800;font-size:.85rem}
select,input[type=text],input[type=color]{
 width:100%;border:2px solid #241f20;border-radius:10px;background:white;
 min-height:40px;padding:7px;color:#241f20
}
input[type=color]{padding:3px}
.check{display:flex;align-items:center;gap:8px;min-height:40px;font-weight:800}
.check input{width:20px;height:20px;accent-color:var(--pink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.primary,.secondary,.danger{
 border:2px solid #241f20;border-radius:12px;padding:10px 13px;font-weight:900;
 box-shadow:3px 3px 0 #241f20
}
.primary{background:var(--green)}.secondary{background:var(--cyan)}.danger{background:#ff8fa3}
.primary:active,.secondary:active,.danger:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #241f20}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #8338ec;outline-offset:2px}
.notice{background:#fff3cd;border:2px solid #9b6b00;border-radius:10px;padding:10px;font-size:.86rem;margin-bottom:12px}
.notice.hidden{display:none}
.roll-bar{height:15px;background:#241f20;border-radius:99px;overflow:hidden;margin-top:8px}
.roll-fill{height:100%;background:linear-gradient(90deg,#06d6a0,#ffd166,#ff477e);width:100%;transition:.3s}
.gallery-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border:3px solid #241f20;border-radius:12px;padding:7px;box-shadow:4px 4px 0 #241f20;position:relative}
.card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;background:#ddd}
.card-actions{display:flex;gap:5px;margin-top:7px}
.card-actions button{flex:1;padding:6px 4px;border:2px solid #241f20;border-radius:7px;background:#ffd166;font-weight:bold;font-size:.72rem}
.empty{text-align:center;color:var(--muted);padding:25px 8px}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;place-items:center;padding:15px}
.modal.show{display:grid}
.modal-box{background:#fffaf4;border:4px solid #241f20;border-radius:20px;padding:12px;max-width:min(94vw,850px);max-height:94vh;overflow:auto;box-shadow:8px 8px 0 #ff477e}
.modal-box img{max-width:100%;max-height:70vh;display:block;margin:auto;border-radius:8px}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:#241f20;color:#fff;padding:11px 15px;border-radius:10px;z-index:50;transition:.25s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:800px){
 body{padding:10px}.layout{grid-template-columns:1fr}.camera-shell{max-width:600px;margin:auto;width:100%}
 .panel{box-shadow:5px 6px 0 #241f20}
}
@media(max-width:430px){
 .controls-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.shutter{width:80px;height:80px}
 .camera-bottom{gap:5px}.counter{min-width:90px;padding:5px}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>📸 Disposable Camera Photobooth</h1>
  <p class="subtitle">Jepret sekarang. Develop nanti. Biar vibes filmnya keluar.</p>
</header>

<div class="layout">
<section class="camera-shell" aria-label="Kamera disposable">
  <div class="brand">
    <span>FILM POP! ✦</span>
    <div class="top-controls">
      <div class="lens" aria-hidden="true"></div>
      <small id="flashIndicator">FLASH ON</small>
    </div>
  </div>

  <div class="viewfinder" id="viewfinder">
    <video id="video" autoplay playsinline muted aria-label="Preview kamera"></video>
    <canvas id="viewCanvas"></canvas>
    <div class="grid-overlay" id="gridOverlay"></div>
    <div class="viewfinder-status" id="cameraStatus"></div>
  </div>

  <div class="camera-bottom">
    <div class="counter" aria-live="polite">
      <span>SISA FOTO</span><strong id="remaining">24</strong>
    </div>
    <button class="shutter" id="shutter" aria-label="Ambil foto">JEPRET</button>
    <div class="wind" id="wind"><i></i><span>WIND</span></div>
  </div>

  <div class="little-controls">
    <button class="pill" id="switchCamera" type="button">↔ Kamera</button>
    <button class="pill" id="mirrorBtn" type="button">◐ Mirror</button>
    <button class="pill" id="gridBtn" type="button">▦ Grid</button>
    <button class="pill active" id="flashBtn" type="button">⚡ Flash</button>
    <button class="pill" id="muteBtn" type="button">🔊 Suara</button>
  </div>
</section>

<main>
  <div class="panel">
    <h2>⚙️ Pengaturan Pemotretan</h2>
    <div id="secureNotice" class="notice hidden"></div>
    <div id="cameraError" class="notice hidden"></div>
    <div class="controls-grid">
      <div class="field">
        <label for="rollSelect">Roll film</label>
        <select id="rollSelect">
          <option value="12">12 exposure</option>
          <option value="24" selected>24 exposure</option>
          <option value="36">36 exposure</option>
        </select>
      </div>
      <div class="field">
        <label for="countdown">Countdown</label>
        <select id="countdown">
          <option value="0">Tanpa timer</option>
          <option value="3">3 detik</option>
          <option value="5">5 detik</option>
        </select>
      </div>
      <div class="field">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="single">Single Photo</option>
          <option value="strip">Photo Strip 4 Pose</option>
          <option value="grid">Grid 2×2</option>
          <option value="polaroid">Polaroid</option>
        </select>
      </div>
      <div class="field">
        <label for="poseTimer">Jeda per pose</label>
        <select id="poseTimer">
          <option value="2">2 detik</option>
          <option value="3" selected>3 detik</option>
          <option value="5">5 detik</option>
        </select>
      </div>
      <div class="field">
        <label for="stock">Film stock</label>
        <select id="stock">
          <option value="warm">Classic Warm</option>
          <option value="cool">Cool Green</option>
          <option value="bw">B&W</option>
          <option value="expired">Expired Film</option>
          <option value="pastel">Soft Pastel</option>
        </select>
      </div>
      <div class="field">
        <label for="frame">Bingkai</label>
        <select id="frame">
          <option value="classic">Classic Film</option>
          <option value="polaroid">Polaroid</option>
          <option value="korean">Korean Style</option>
          <option value="y2k">Y2K</option>
          <option value="newspaper">Newspaper</option>
          <option value="minimal">Minimalist</option>
          <option value="cute">Cute</option>
        </select>
      </div>
      <div class="field">
        <label for="frameText">Teks pada bingkai</label>
        <input id="frameText" type="text" maxlength="36" placeholder="mis. summer 2026 ✶">
      </div>
      <div class="field">
        <label for="frameColor">Warna bingkai</label>
        <input id="frameColor" type="color" value="#fffaf4" aria-label="Warna bingkai">
      </div>
    </div>
    <div class="actions">
      <button class="secondary" id="uploadBtn" type="button">🖼️ Upload dari Galeri</button>
      <input id="uploadInput" type="file" accept="image/*" multiple hidden>
      <button class="primary" id="developBtn" type="button">✨ Develop Roll</button>
      <button class="secondary" id="clearRollBtn" type="button">🗑️ Kosongkan Roll</button>
    </div>
    <div style="margin-top:12px;font-weight:900">
      Roll film: <span id="rollLabel">24</span> exposure
      <div class="roll-bar"><div class="roll-fill" id="rollFill"></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="gallery-head">
      <h2>🧺 Galeri Hasil</h2>
      <div class="actions" style="margin:0">
        <button class="primary" id="downloadAll" type="button">⬇ Download Semua</button>
        <button class="secondary" id="shareAll" type="button">↗ Share</button>
      </div>
    </div>
    <div id="gallery" class="gallery">
      <div class="empty">Belum ada foto yang di-develop. Roll film kamu masih rahasia 🤫</div>
    </div>
  </div>
</main>
</div>
</div>

<div class="flash-light" id="flashLight"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Preview foto">
  <div class="modal-box">
    <img id="modalImage" alt="Preview foto besar">
    <div class="modal-actions">
      <button class="primary" id="modalDownload" type="button">⬇ Download PNG</button>
      <button class="secondary" id="modalShare" type="button">↗ Share</button>
      <button class="danger" id="closeModal" type="button">Tutup</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("viewCanvas"), ctx = canvas.getContext("2d");
const state = {
  stream:null, facing:"user", mirror:false, grid:false, flash:true, muted:false,
  roll:24, raw:[], developed:[], currentModal:null, busy:false
};

const DB_KEY = "disposablePhotoboothResultsV1";
const ROLL_KEY = "disposablePhotoboothRollV1";

function toast(message){
  const el=$("toast"); el.textContent=message; el.classList.add("show");
  clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.remove("show"),2600);
}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function dataURLToBlob(data){
  const parts=data.split(","), mime=parts[0].match(/:(.*?);/)[1];
  const bin=atob(parts[1]), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
function saveState(){
  try{
    localStorage.setItem(ROLL_KEY,JSON.stringify({roll:state.roll,raw:state.raw}));
    localStorage.setItem(DB_KEY,JSON.stringify(state.developed));
  }catch(e){toast("Penyimpanan lokal penuh. Foto tetap tersedia sampai halaman ditutup.")}
}
function loadState(){
  try{
    const r=JSON.parse(localStorage.getItem(ROLL_KEY)||"null");
    const d=JSON.parse(localStorage.getItem(DB_KEY)||"[]");
    if(r){state.roll=Number(r.roll)||24;state.raw=Array.isArray(r.raw)?r.raw:[]}
    state.developed=Array.isArray(d)?d:[];
  }catch(e){state.roll=24;state.raw=[];state.developed=[]}
  $("rollSelect").value=String(state.roll);
  updateCounter(); renderGallery();
}
function updateCounter(){
  const left=Math.max(0,state.roll-state.raw.length);
  $("remaining").textContent=left;
  $("rollLabel").textContent=state.roll;
  $("rollFill").style.width=(left/state.roll*100)+"%";
  $("shutter").disabled=state.busy||left<=0;
}
function showError(msg){
  $("cameraError").textContent=msg;
  $("cameraError").classList.remove("hidden");
}
function clearError(){$("cameraError").classList.add("hidden")}
function secureMessage(){
  if(location.protocol==="file:"){
    $("secureNotice").textContent="Catatan: file:// biasanya tidak mengizinkan kamera. Jalankan lewat HTTPS atau localhost. Upload galeri tetap bisa digunakan.";
    $("secureNotice").classList.remove("hidden");
  }
}
async function startCamera(){
  clearError();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    showError("Browser ini tidak mendukung kamera. Silakan upload foto dari galeri.");
    return;
  }
  if(state.stream)state.stream.getTracks().forEach(t=>t.stop());
  try{
    state.stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:state.facing},width:{ideal:1280},height:{ideal:960}},
      audio:false
    });
    video.srcObject=state.stream;
    video.classList.toggle("mirrored",state.mirror&&state.facing==="user");
    await video.play();
    $("cameraStatus").classList.remove("show");
  }catch(err){
    const denied=err&&["NotAllowedError","PermissionDeniedError"].includes(err.name);
    showError(denied
      ?"Izin kamera ditolak. Izinkan akses kamera di pengaturan browser, atau gunakan Upload dari Galeri."
      :"Kamera tidak tersedia atau sedang digunakan aplikasi lain. Coba tutup aplikasi kamera lain atau gunakan Upload dari Galeri.");
    $("cameraStatus").textContent="Kamera tidak aktif — gunakan upload galeri";
    $("cameraStatus").classList.add("show");
  }
}
function beep(type="shutter"){
  if(state.muted)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();
    o.type=type==="wind"?"triangle":"square";
    o.frequency.setValueAtTime(type==="wind"?180:900,ac.currentTime);
    if(type==="wind")o.frequency.exponentialRampToValueAtTime(70,ac.currentTime+.35);
    else o.frequency.exponentialRampToValueAtTime(180,ac.currentTime+.08);
    g.gain.setValueAtTime(.001,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.2,ac.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+(type==="wind"? .38:.12));
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(type==="wind"? .4:.14));
    setTimeout(()=>ac.close().catch(()=>{}),500);
  }catch(e){}
}
function doFlash(){
  if(!state.flash)return;
  $("flashLight").classList.remove("fire");void $("flashLight").offsetWidth;
  $("flashLight").classList.add("fire");
}
function getCapture(){
  const w=video.videoWidth||640,h=video.videoHeight||480;
  canvas.width=w;canvas.height=h;
  ctx.save();
  if(state.mirror&&state.facing==="user"){ctx.translate(w,0);ctx.scale(-1,1)}
  ctx.drawImage(video,0,0,w,h);ctx.restore();
  return canvas.toDataURL("image/jpeg",.92);
}
function imageFromURL(url){
  return new Promise((resolve,reject)=>{
    const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url;
  });
}
async function countdown(seconds){
  if(!seconds)return;
  for(let i=seconds;i>0;i--){
    $("cameraStatus").textContent=String(i);
    $("cameraStatus").classList.add("show");
    await sleep(1000);
  }
  $("cameraStatus").classList.remove("show");
}
async function takePhoto(silent=false){
  if(state.busy)return;
  if(state.raw.length>=state.roll){toast("Roll film sudah habis. Develop dulu ya!");return}
  state.busy=true;updateCounter();
  await countdown(Number($("countdown").value));
  $("shutter").classList.add("pressed");beep("shutter");doFlash();
  state.raw.push({src:getCapture(),created:new Date().toISOString(),flash:state.flash});
  await sleep(130);
  $("shutter").classList.remove("pressed");
  $("wind").classList.add("spinning");beep("wind");await sleep(520);$("wind").classList.remove("spinning");
  saveState();state.busy=false;updateCounter();
  if(!silent)toast("Foto masuk roll film. Jangan intip dulu 📸");
}
async function sequence(){
  if(state.busy)return;
  const mode=$("mode").value;
  const count=(mode==="strip"||mode==="grid")?4:1;
  const delay=Number($("poseTimer").value)*1000;
  if(state.roll-state.raw.length<count){toast("Foto tersisa tidak cukup untuk mode ini.");return}
  state.busy=true;updateCounter();
  for(let i=0;i<count;i++){
    if(i>0){$("cameraStatus").textContent=`Pose ${i+1}/${count}`;$("cameraStatus").classList.add("show");await sleep(delay)}
    state.busy=false;await takePhoto(true);
    state.busy=true;
  }
  $("cameraStatus").classList.remove("show");state.busy=false;updateCounter();
  toast(`${count} pose tersimpan di roll film ✨`);
}
function noise(ctx,w,h,amount){
  const img=ctx.getImageData(0,0,w,h),d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-.5)*amount;
    d[i]+=n;d[i+1]+=n;d[i+2]+=n;
  }
  ctx.putImageData(img,0,0);
}
function drawVignette(c,w,h){
  const g=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.18,w/2,h/2,Math.max(w,h)*.72);
  g.addColorStop(0,"transparent");g.addColorStop(.68,"#00000005");g.addColorStop(1,"#160b1688");
  c.fillStyle=g;c.fillRect(0,0,w,h);
}
function filmFilter(c,stock,w,h){
  const img=c.getImageData(0,0,w,h),d=img.data;
  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2],gray=.299*r+.587*g+.114*b;
    if(stock==="warm"){r=r*1.08+10;g=g*.96+3;b=b*.78}
    if(stock==="cool"){r=r*.82;g=g*1.05+3;b=b*.98+8}
    if(stock==="bw"){r=g=b=gray*1.06}
    if(stock==="expired"){r=r*1.12+8;g=g*.88;b=b*.65+18}
    if(stock==="pastel"){r=r*.94+18;g=g*.94+18;b=b*.94+18}
    const contrast=stock==="expired"?1.13:1.08;
    d[i]=Math.max(0,Math.min(255,(r-128)*contrast+128));
    d[i+1]=Math.max(0,Math.min(255,(g-128)*contrast+128));
    d[i+2]=Math.max(0,Math.min(255,(b-128)*contrast+128));
  }
  c.putImageData(img,0,0);
}
function drawLightLeak(c,w,h){
  const g=c.createLinearGradient(0,0,w*.8,h);
  g.addColorStop(0,"#ff5a5a66");g.addColorStop(.18,"#ffd16622");g.addColorStop(.52,"transparent");g.addColorStop(1,"transparent");
  c.fillStyle=g;c.fillRect(0,0,w,h);
}
function stamp(c,w,h){
  const text=new Date().toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"2-digit"});
  c.font=`bold ${Math.max(14,w*.025)}px monospace`;
  c.fillStyle="#ff6b35";c.shadowColor="#30140a";c.shadowBlur=2;
  c.fillText(text,w- c.measureText(text).width-18,h-18);c.shadowBlur=0;
}
function addFrame(src,opts){
  return new Promise(async resolve=>{
    const im=await imageFromURL(src), mode=opts.mode, frame=opts.frame;
    let w=im.width,h=im.height,pad=0;
    if(mode==="strip"){w=Math.round(im.width*.72);h=Math.round(im.height*.72)}
    const out=document.createElement("canvas"),o=out.getContext("2d");
    const border=frame==="polaroid"||mode==="polaroid"?Math.round(w*.1):Math.round(w*.055);
    let cw=w+border*2,ch=h+border*2+(frame==="polaroid"||mode==="polaroid"?border*1.8:0);
    out.width=cw;out.height=ch;
    o.fillStyle=opts.color;o.fillRect(0,0,cw,ch);
    o.drawImage(im,border,border,w,h);
    o.fillStyle="#241f20";o.textAlign="center";
    o.font=`bold ${Math.max(14,w*.035)}px Arial`;
    const labels={
      classic:"FILM POP • 35MM",polaroid:"",korean:"TODAY'S MOOD ✦",
      y2k:"★ DIGITAL DREAM ★",newspaper:"THE DAILY SNAP",minimal:"",cute:"♡ memories ♡"
    };
    const label=opts.text||labels[frame]||"";
    if(label)o.fillText(label,cw/2,ch-border*.48);
    if(frame==="newspaper"){o.strokeStyle="#241f20";o.lineWidth=3;o.strokeRect(border*.55,border*.55,cw-border*1.1,ch-border*1.1)}
    if(frame==="y2k"){o.strokeStyle="#8338ec";o.lineWidth=border*.2;o.strokeRect(border*.45,border*.45,cw-border*.9,ch-border*.9)}
    resolve(out.toDataURL("image/png"));
  });
}
async function processPhoto(item,index,total){
  const im=await imageFromURL(item.src);
  const out=document.createElement("canvas"),c=out.getContext("2d");
  out.width=im.width;out.height=im.height;c.drawImage(im,0,0);
  filmFilter(c,out.width,out.height,$("stock").value);
  if(item.flash){
    const g=c.createRadialGradient(out.width/2,out.height/2,2,out.width/2,out.height/2,Math.max(out.width,out.height)*.65);
    g.addColorStop(0,"#fff8");g.addColorStop(.3,"transparent");g.addColorStop(1,"#fff0");
    c.fillStyle=g;c.fillRect(0,0,out.width,out.height);
  }
  drawLightLeak(c,out.width,out.height);drawVignette(c,out.width,out.height);noise(c,out.width,out.height,18);stamp(c,out.width,out.height);
  return addFrame(out.toDataURL("image/jpeg",.94),{
    mode:$("mode").value,frame:$("frame").value,color:$("frameColor").value,text:$("frameText").value
  });
}
async function develop(){
  if(state.busy)return;
  if(!state.raw.length){toast("Belum ada foto di roll film.");return}
  state.busy=true;updateCounter();toast("Sedang develop film…");
  const produced=[];
  for(let i=0;i<state.raw.length;i++)produced.push(await processPhoto(state.raw[i],i,state.raw.length));
  const mode=$("mode").value;
  if(mode==="strip"||mode==="grid"){
    const combined=await makeComposite(produced,mode);
    state.developed.push({src:combined,type:mode,created:new Date().toISOString()});
  }else{
    produced.forEach(src=>state.developed.push({src,type:mode,created:new Date().toISOString()}));
  }
  state.raw=[];saveState();renderGallery();state.busy=false;updateCounter();
  toast("Develop selesai! Hasilnya sudah muncul ✨");
}
async function makeComposite(srcs,mode){
  const ims=await Promise.all(srcs.map(imageFromURL)),cols=mode==="strip"?1:2;
  const cellW=Math.max(...ims.map(x=>x.width)),cellH=Math.max(...ims.map(x=>x.height));
  const gap=18,rows=Math.ceil(ims.length/cols),out=document.createElement("canvas");
  out.width=cols*cellW+(cols+1)*gap;out.height=rows*cellH+(rows+1)*gap;
  const c=out.getContext("2d");c.fillStyle=$("frameColor").value;c.fillRect(0,0,out.width,out.height);
  ims.forEach((im,i)=>c.drawImage(im,gap+(i%cols)*(cellW+gap),gap+Math.floor(i/cols)*(cellH+gap),cellW,cellH));
  return out.toDataURL("image/png");
}
function renderGallery(){
  const g=$("gallery");g.innerHTML="";
  if(!state.developed.length){g.innerHTML='<div class="empty">Belum ada foto yang di-develop. Roll film kamu masih rahasia 🤫</div>';return}
  state.developed.forEach((item,i)=>{
    const card=document.createElement("div");card.className="card";
    const img=document.createElement("img");img.src=item.src;img.alt=`Hasil foto ${i+1}`;img.loading="lazy";
    img.addEventListener("click",()=>openModal(i));
    const actions=document.createElement("div");actions.className="card-actions";
    const dl=document.createElement("button");dl.textContent="Download";dl.onclick=()=>download(item.src,`film-pop-${i+1}.png`);
    const del=document.createElement("button");del.textContent="Hapus";del.onclick=()=>{state.developed.splice(i,1);saveState();renderGallery();toast("Foto dihapus")};
    actions.append(dl,del);card.append(img,actions);g.append(card);
  });
}
function download(src,name){
  const a=document.createElement("a");a.href=src;a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function openModal(i){
  state.currentModal=i;$("modalImage").src=state.developed[i].src;$("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show")}
async function share(src){
  if(!navigator.share){toast("Web Share tidak tersedia di browser ini.");return}
  try{
    const blob=dataURLToBlob(src),file=new File([blob],"disposable-photo.png",{type:"image/png"});
    await navigator.share({title:"Disposable Camera Photobooth",text:"Foto filmku ✨",files:[file]});
  }catch(e){if(e.name!=="AbortError")toast("Foto tidak dapat dibagikan.")}
}
function resetRoll(){
  if(!confirm("Hapus semua foto yang belum di-develop?"))return;
  state.raw=[];saveState();updateCounter();toast("Roll film dikosongkan.");
}

$("shutter").onclick=sequence;
$("switchCamera").onclick=async()=>{state.facing=state.facing==="user"?"environment":"user";await startCamera()};
$("mirrorBtn").onclick=()=>{state.mirror=!state.mirror;video.classList.toggle("mirrored",state.mirror&&state.facing==="user");$("mirrorBtn").classList.toggle("active",state.mirror)};
$("gridBtn").onclick=()=>{state.grid=!state.grid;$("gridOverlay").classList.toggle("show",state.grid);$("gridBtn").classList.toggle("active",state.grid)};
$("flashBtn").onclick=()=>{state.flash=!state.flash;$("flashBtn").classList.toggle("active",state.flash);$("flashIndicator").textContent=state.flash?"FLASH ON":"FLASH OFF"};
$("muteBtn").onclick=()=>{state.muted=!state.muted;$("muteBtn").textContent=state.muted?"🔇 Mute":"🔊 Suara"};
$("uploadBtn").onclick=()=>$("uploadInput").click();
$("uploadInput").onchange=async e=>{
  const files=[...e.target.files];
  for(const file of files){
    if(state.raw.length>=state.roll)break;
    const reader=new FileReader();
    await new Promise(resolve=>{reader.onload=()=>{state.raw.push({src:reader.result,created:new Date().toISOString(),flash:false});resolve()};reader.readAsDataURL(file)});
  }
  saveState();updateCounter();toast(`${Math.min(files.length,state.roll-state.raw.length+files.length)} foto masuk roll film.`);
  e.target.value="";
};
$("rollSelect").onchange=()=>{
  const n=Number($("rollSelect").value);
  if(state.raw.length>n){toast("Roll lebih kecil dari foto yang sudah tersimpan.");$("rollSelect").value=String(state.roll);return}
  state.roll=n;saveState();updateCounter();
};
$("developBtn").onclick=develop;
$("clearRollBtn").onclick=resetRoll;
$("downloadAll").onclick=()=>{
  if(!state.developed.length){toast("Belum ada hasil untuk di-download.");return}
  state.developed.forEach((x,i)=>setTimeout(()=>download(x.src,`film-pop-${i+1}.png`),i*180));
};
$("shareAll").onclick=()=>state.currentModal!==null?share(state.developed[state.currentModal].src):toast("Klik salah satu foto dahulu untuk share.");
$("closeModal").onclick=closeModal;
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()};
$("modalDownload").onclick=()=>{if(state.currentModal!==null)download(state.developed[state.currentModal].src,"film-pop-photo.png")};
$("modalShare").onclick=()=>{if(state.currentModal!==null)share(state.developed[state.currentModal].src)};
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea"))return;
  if(e.code==="Space"){e.preventDefault();sequence()}
  if(e.key.toLowerCase()==="f")$("flashBtn").click();
  if(e.key.toLowerCase()==="m")$("mirrorBtn").click();
  if(e.key.toLowerCase()==="d")develop();
  if(e.key==="Escape")closeModal();
});
window.addEventListener("beforeunload",()=>{if(state.stream)state.stream.getTracks().forEach(t=>t.stop())});

secureMessage();loadState();startCamera();
})();
</script>
