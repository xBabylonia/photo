<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff477e">
<title>Disposable Camera Photobooth</title>

<style>
:root{
  --pink:#ff477e;
  --orange:#ff7a59;
  --yellow:#ffd166;
  --cyan:#70d6ff;
  --green:#06d6a0;
  --purple:#8338ec;
  --ink:#241f20;
  --paper:#fffaf4;
  --muted:#756d6b;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  padding:16px;
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 12% 15%,#fff 0 2px,transparent 3px),
    radial-gradient(circle at 85% 22%,#fff 0 2px,transparent 3px),
    linear-gradient(135deg,#ffcad4,#ffd166 48%,#70d6ff);
  background-size:42px 42px,55px 55px,100% 100%;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible{
  outline:4px solid var(--purple);
  outline-offset:2px;
}

.app{
  width:100%;
  max-width:1240px;
  margin:auto;
}

header{
  text-align:center;
  margin:4px auto 18px;
}

h1{
  margin:0;
  font-size:clamp(1.8rem,5vw,3.2rem);
  letter-spacing:-2px;
}

.subtitle{
  margin:6px 0;
  color:#4f4747;
  font-weight:700;
}

.layout{
  display:grid;
  grid-template-columns:minmax(280px,540px) 1fr;
  gap:18px;
  align-items:start;
}

.camera-shell{
  position:relative;
  overflow:hidden;
  padding:16px;
  border:5px solid #221d1f;
  border-radius:35px;
  background:linear-gradient(145deg,var(--pink),var(--orange));
  box-shadow:10px 12px 0 #221d1f,0 18px 35px #0003;
}

.camera-shell::before{
  content:"";
  position:absolute;
  inset:9px;
  border:2px dashed #fff8;
  border-radius:27px;
  pointer-events:none;
}

.brand{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#fff;
  font-weight:900;
}

.brand span:first-child{
  font-size:1.2rem;
  letter-spacing:2px;
}

.brand small{
  padding:5px 8px;
  border-radius:8px;
  background:#221d1f;
}

.top-controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.lens{
  width:44px;
  height:44px;
  border:4px solid #221d1f;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#fff 0 8%,#70d6ff 10% 25%,#164e63 28% 53%,#111 55%);
}

.viewfinder{
  position:relative;
  overflow:hidden;
  aspect-ratio:4 / 3;
  margin:17px 7px 12px;
  border:8px solid #221d1f;
  border-radius:18px;
  background:#111;
  box-shadow:inset 0 0 0 2px #fff5;
}

#video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(1);
}

#video.mirrored{
  transform:scaleX(-1);
}

#viewCanvas{
  display:none;
}

.grid-overlay{
  position:absolute;
  inset:0;
  display:none;
  pointer-events:none;
}

.grid-overlay.show{
  display:block;
  background:
    linear-gradient(
      90deg,
      transparent 32.8%,
      #fff9 33%,
      transparent 33.4%,
      transparent 66.1%,
      #fff9 66.4%,
      transparent 66.8%
    ),
    linear-gradient(
      0deg,
      transparent 32.8%,
      #fff9 33%,
      transparent 33.4%,
      transparent 66.1%,
      #fff9 66.4%,
      transparent 66.8%
    );
}

.viewfinder-status{
  position:absolute;
  right:10px;
  bottom:8px;
  left:10px;
  display:none;
  padding:5px;
  border-radius:8px;
  color:#fff;
  background:#000a;
  font-size:.75rem;
  text-align:center;
}

.viewfinder-status.show{
  display:block;
}

.flash-light{
  position:fixed;
  z-index:30;
  inset:0;
  opacity:0;
  background:#fff;
  pointer-events:none;
}

.flash-light.fire{
  animation:flash .42s ease-out;
}

@keyframes flash{
  0%{opacity:0}
  18%{opacity:1}
  100%{opacity:0}
}

.camera-bottom{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.shutter{
  flex:none;
  width:92px;
  height:92px;
  border:7px solid #221d1f;
  border-radius:50%;
  color:#221d1f;
  background:#fff;
  box-shadow:0 5px 0 #bbb,0 8px 0 #221d1f;
  font-weight:900;
  transition:.12s;
}

.shutter:active,
.shutter.pressed{
  transform:translateY(5px);
  box-shadow:0 2px 0 #bbb,0 3px 0 #221d1f;
}

.shutter:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.counter{
  min-width:105px;
  padding:7px 10px;
  border:3px solid var(--yellow);
  border-radius:9px;
  color:var(--yellow);
  background:#221d1f;
  font-family:monospace;
  font-weight:bold;
  text-align:center;
}

.counter strong{
  display:block;
  font-size:1.55rem;
}

.wind{
  color:#fff;
  font-size:.7rem;
  text-align:center;
}

.wind i{
  display:block;
  width:42px;
  height:42px;
  margin:auto;
  border:5px dotted #fff;
  border-radius:50%;
}

.wind.spinning i{
  animation:spin .55s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.little-controls{
  position:relative;
  z-index:1;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:14px;
}

.pill,
.control-btn{
  padding:8px 11px;
  border:2px solid #221d1f;
  border-radius:999px;
  color:#221d1f;
  background:#fff;
  box-shadow:3px 3px 0 #221d1f;
  font-weight:800;
}

.pill.active,
.control-btn.active{
  background:var(--yellow);
}

.pill:active,
.control-btn:active{
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 #221d1f;
}

.panel{
  padding:16px;
  border:4px solid var(--ink);
  border-radius:22px;
  background:#fffaf4ef;
  box-shadow:7px 8px 0 var(--ink);
}

.panel + .panel{
  margin-top:15px;
}

.panel h2{
  margin:0 0 12px;
  font-size:1.15rem;
}

.controls-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

label{
  font-size:.85rem;
  font-weight:800;
}

select,
input[type="text"],
input[type="color"]{
  width:100%;
  min-height:40px;
  padding:7px;
  border:2px solid var(--ink);
  border-radius:10px;
  color:var(--ink);
  background:#fff;
}

input[type="color"]{
  padding:3px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.primary,
.secondary,
.danger{
  padding:10px 13px;
  border:2px solid var(--ink);
  border-radius:12px;
  box-shadow:3px 3px 0 var(--ink);
  font-weight:900;
}

.primary{
  background:var(--green);
}

.secondary{
  background:var(--cyan);
}

.danger{
  background:#ff8fa3;
}

.primary:active,
.secondary:active,
.danger:active{
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 var(--ink);
}

.notice{
  margin-bottom:12px;
  padding:10px;
  border:2px solid #9b6b00;
  border-radius:10px;
  background:#fff3cd;
  font-size:.86rem;
}

.notice.hidden{
  display:none;
}

.roll-bar{
  height:15px;
  overflow:hidden;
  margin-top:8px;
  border-radius:99px;
  background:var(--ink);
}

.roll-fill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,var(--green),var(--yellow),var(--pink));
  transition:.3s;
}

.gallery-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:12px;
  margin-top:12px;
}

.card{
  position:relative;
  padding:7px;
  border:3px solid var(--ink);
  border-radius:12px;
  background:#fff;
  box-shadow:4px 4px 0 var(--ink);
}

.card img{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  border-radius:6px;
  background:#ddd;
  object-fit:cover;
  cursor:pointer;
}

.card-actions{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.card-actions button{
  flex:1;
  padding:6px 4px;
  border:2px solid var(--ink);
  border-radius:7px;
  background:var(--yellow);
  font-size:.72rem;
  font-weight:bold;
}

.empty{
  padding:25px 8px;
  color:var(--muted);
  text-align:center;
}

.modal{
  position:fixed;
  z-index:20;
  inset:0;
  display:none;
  place-items:center;
  padding:15px;
  background:#000b;
}

.modal.show{
  display:grid;
}

.modal-box{
  max-width:min(94vw,850px);
  max-height:94vh;
  overflow:auto;
  padding:12px;
  border:4px solid var(--ink);
  border-radius:20px;
  background:var(--paper);
  box-shadow:8px 8px 0 var(--pink);
}

.modal-box img{
  display:block;
  max-width:100%;
  max-height:70vh;
  margin:auto;
  border-radius:8px;
}

.modal-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:10px;
}

#toast{
  position:fixed;
  z-index:50;
  bottom:20px;
  left:50%;
  max-width:90%;
  padding:11px 15px;
  border-radius:10px;
  color:#fff;
  background:var(--ink);
  text-align:center;
  transform:translateX(-50%) translateY(80px);
  transition:.25s;
}

#toast.show{
  transform:translateX(-50%) translateY(0);
}

@media(max-width:800px){
  body{
    padding:10px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .camera-shell{
    width:100%;
    max-width:600px;
    margin:auto;
  }

  .panel{
    box-shadow:5px 6px 0 var(--ink);
  }
}

@media(max-width:430px){
  .controls-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .shutter{
    width:80px;
    height:80px;
  }

  .camera-bottom{
    gap:5px;
  }

  .counter{
    min-width:90px;
    padding:5px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>📸 Disposable Camera Photobooth</h1>
  <p class="subtitle">
    Jepret sekarang. Develop nanti. Biar vibes filmnya keluar.
  </p>
</header>

<div class="layout">

<section class="camera-shell" aria-label="Kamera disposable">
  <div class="brand">
    <span>FILM POP! ✦</span>

    <div class="top-controls">
      <div class="lens" aria-hidden="true"></div>
      <small id="flashIndicator">FLASH ON</small>
    </div>
  </div>

  <div class="viewfinder" id="viewfinder">
    <video
      id="video"
      autoplay
      playsinline
      muted
      aria-label="Preview kamera"
    ></video>

    <canvas id="viewCanvas"></canvas>

    <div class="grid-overlay" id="gridOverlay"></div>

    <div
      class="viewfinder-status"
      id="cameraStatus"
      aria-live="polite"
    ></div>
  </div>

  <div class="camera-bottom">
    <div class="counter" aria-live="polite">
      <span>SISA FOTO</span>
      <strong id="remaining">24</strong>
    </div>

    <button
      class="shutter"
      id="shutter"
      type="button"
      aria-label="Ambil foto"
    >
      JEPRET
    </button>

    <div class="wind" id="wind">
      <i></i>
      <span>WIND</span>
    </div>
  </div>

  <div class="little-controls">
    <button class="pill" id="switchCamera" type="button">
      ↔ Kamera
    </button>

    <button class="pill" id="mirrorBtn" type="button">
      ◐ Mirror
    </button>

    <button class="pill" id="gridBtn" type="button">
      ▦ Grid
    </button>

    <button class="pill active" id="flashBtn" type="button">
      ⚡ Flash
    </button>

    <button class="pill" id="muteBtn" type="button">
      🔊 Suara
    </button>
  </div>
</section>

<main>

<div class="panel">
  <h2>⚙️ Pengaturan Pemotretan</h2>

  <div id="secureNotice" class="notice hidden"></div>
  <div id="cameraError" class="notice hidden"></div>

  <div class="controls-grid">

    <div class="field">
      <label for="rollSelect">Roll film</label>
      <select id="rollSelect">
        <option value="12">12 exposure</option>
        <option value="24" selected>24 exposure</option>
        <option value="36">36 exposure</option>
      </select>
    </div>

    <div class="field">
      <label for="countdown">Countdown</label>
      <select id="countdown">
        <option value="0">Tanpa timer</option>
        <option value="3">3 detik</option>
        <option value="5">5 detik</option>
      </select>
    </div>

    <div class="field">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="single">Single Photo</option>
        <option value="strip">Photo Strip 4 Pose</option>
        <option value="grid">Grid 2×2</option>
        <option value="polaroid">Polaroid</option>
      </select>
    </div>

    <div class="field">
      <label for="poseTimer">Jeda per pose</label>
      <select id="poseTimer">
        <option value="2">2 detik</option>
        <option value="3" selected>3 detik</option>
        <option value="5">5 detik</option>
      </select>
    </div>

    <div class="field">
      <label for="stock">Film stock</label>
      <select id="stock">
        <option value="warm">Classic Warm</option>
        <option value="cool">Cool Green</option>
        <option value="bw">B&W</option>
        <option value="expired">Expired Film</option>
        <option value="pastel">Soft Pastel</option>
      </select>
    </div>

    <div class="field">
      <label for="frame">Bingkai</label>
      <select id="frame">
        <option value="classic">Classic Film</option>
        <option value="polaroid">Polaroid</option>
        <option value="korean">Korean Style</option>
        <option value="y2k">Y2K</option>
        <option value="newspaper">Newspaper</option>
        <option value="minimal">Minimalist</option>
        <option value="cute">Cute</option>
      </select>
    </div>

    <div class="field">
      <label for="frameText">Teks pada bingkai</label>
      <input
        id="frameText"
        type="text"
        maxlength="36"
        placeholder="mis. summer 2026 ✶"
      >
    </div>

    <div class="field">
      <label for="frameColor">Warna bingkai</label>
      <input
        id="frameColor"
        type="color"
        value="#fffaf4"
        aria-label="Warna bingkai"
      >
    </div>

  </div>

  <div class="actions">
    <button class="secondary" id="uploadBtn" type="button">
      🖼️ Upload dari Galeri
    </button>

    <input
      id="uploadInput"
      type="file"
      accept="image/*"
      multiple
      hidden
    >

    <button class="primary" id="developBtn" type="button">
      ✨ Develop Roll
    </button>

    <button class="secondary" id="clearRollBtn" type="button">
      🗑️ Kosongkan Roll
    </button>
  </div>

  <div style="margin-top:12px;font-weight:900">
    Roll film:
    <span id="rollLabel">24</span>
    exposure

    <div class="roll-bar">
      <div class="roll-fill" id="rollFill"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="gallery-head">
    <h2>🧺 Galeri Hasil</h2>

    <div class="actions" style="margin:0">
      <button class="primary" id="downloadAll" type="button">
        ⬇ Download Semua
      </button>

      <button class="secondary" id="shareAll" type="button">
        ↗ Share
      </button>
    </div>
  </div>

  <div id="gallery" class="gallery">
    <div class="empty">
      Belum ada foto yang di-develop.
      Roll film kamu masih rahasia 🤫
    </div>
  </div>
</div>

</main>
</div>
</div>

<div class="flash-light" id="flashLight"></div>

<div
  class="modal"
  id="modal"
  role="dialog"
  aria-modal="true"
  aria-label="Preview foto"
>
  <div class="modal-box">
    <img id="modalImage" alt="Preview foto besar">

    <div class="modal-actions">
      <button class="primary" id="modalDownload" type="button">
        ⬇ Download PNG
      </button>

      <button class="secondary" id="modalShare" type="button">
        ↗ Share
      </button>

      <button class="danger" id="closeModal" type="button">
        Tutup
      </button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

(() => {
  const $ = id => document.getElementById(id);

  const video = $("video");
  const canvas = $("viewCanvas");
  const ctx = canvas.getContext("2d");

  const state = {
    stream: null,
    facing: "user",
    mirror: false,
    grid: false,
    flash: true,
    muted: false,
    roll: 24,
    raw: [],
    developed: [],
    currentModal: null,
    busy: false
  };

  /*
   * IndexedDB
   *
   * IndexedDB dipakai karena dapat menyimpan data gambar
   * jauh lebih besar daripada localStorage.
   */
  const STORAGE_DB_NAME = "DisposablePhotoboothDB";
  const STORAGE_DB_VERSION = 1;
  const STORAGE_STORE = "photos";

  const STORAGE_ROLL_KEY = "roll";
  const STORAGE_DEVELOPED_KEY = "developed";

  let storageDBPromise = null;
  let saveQueue = Promise.resolve();

  function openStorageDB(){
    if(!("indexedDB" in window)){
      return Promise.reject(
        new Error("IndexedDB tidak tersedia di browser ini")
      );
    }

    if(storageDBPromise){
      return storageDBPromise;
    }

    storageDBPromise = new Promise((resolve,reject) => {
      const request = indexedDB.open(
        STORAGE_DB_NAME,
        STORAGE_DB_VERSION
      );

      request.onupgradeneeded = () => {
        const db = request.result;

        if(!db.objectStoreNames.contains(STORAGE_STORE)){
          db.createObjectStore(STORAGE_STORE);
        }
      };

      request.onsuccess = () => {
        resolve(request.result);
      };

      request.onerror = () => {
        reject(request.error);
      };
    });

    return storageDBPromise;
  }

  async function readFromIndexedDB(key){
    const db = await openStorageDB();

    return new Promise((resolve,reject) => {
      const transaction = db.transaction(
        STORAGE_STORE,
        "readonly"
      );

      const store = transaction.objectStore(STORAGE_STORE);
      const request = store.get(key);

      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function writeToIndexedDB(key,value){
    const db = await openStorageDB();

    return new Promise((resolve,reject) => {
      const transaction = db.transaction(
        STORAGE_STORE,
        "readwrite"
      );

      const store = transaction.objectStore(STORAGE_STORE);
      const request = store.put(value,key);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  async function deleteFromIndexedDB(key){
    const db = await openStorageDB();

    return new Promise((resolve,reject) => {
      const transaction = db.transaction(
        STORAGE_STORE,
        "readwrite"
      );

      const store = transaction.objectStore(STORAGE_STORE);
      const request = store.delete(key);

      request.onsuccess = () => resolve();
      request.onerror = () => reject(request.error);
    });
  }

  function readLegacyLocalStorage(){
    try{
      const roll = JSON.parse(
        localStorage.getItem(
          "disposablePhotoboothRollV1"
        ) || "null"
      );

      const developed = JSON.parse(
        localStorage.getItem(
          "disposablePhotoboothResultsV1"
        ) || "[]"
      );

      return {
        roll,
        developed
      };
    }catch(error){
      console.warn(
        "Data localStorage lama tidak dapat dibaca:",
        error
      );

      return {
        roll: null,
        developed: []
      };
    }
  }

  /*
   * Penyimpanan dibuat berurutan agar dua proses save
   * tidak saling menimpa ketika foto diambil cepat.
   */
  function saveState(){
    const rollData = {
      roll: state.roll,
      raw: state.raw
    };

    saveQueue = saveQueue
      .then(async () => {
        try{
          await writeToIndexedDB(
            STORAGE_ROLL_KEY,
            rollData
          );

          await writeToIndexedDB(
            STORAGE_DEVELOPED_KEY,
            state.developed
          );
        }catch(error){
          console.warn(
            "IndexedDB gagal, mencoba localStorage:",
            error
          );

          try{
            localStorage.setItem(
              "disposablePhotoboothRollV1",
              JSON.stringify(rollData)
            );

            localStorage.setItem(
              "disposablePhotoboothResultsV1",
              JSON.stringify(state.developed)
            );
          }catch(storageError){
            console.error(
              "Semua metode penyimpanan gagal:",
              storageError
            );

            toast(
              "Penyimpanan penuh. Download foto sebelum menutup halaman."
            );
          }
        }
      })
      .catch(error => {
        console.error(
          "Gagal menyimpan state:",
          error
        );
      });

    return saveQueue;
  }

  async function loadState(){
    let rollData = null;
    let developedData = null;

    try{
      rollData = await readFromIndexedDB(
        STORAGE_ROLL_KEY
      );

      developedData = await readFromIndexedDB(
        STORAGE_DEVELOPED_KEY
      );
    }catch(error){
      console.warn(
        "IndexedDB tidak dapat dibaca:",
        error
      );
    }

    /*
     * Migrasi otomatis dari versi lama yang menggunakan
     * localStorage.
     */
    if(!rollData && !developedData){
      const legacy = readLegacyLocalStorage();

      rollData = legacy.roll;
      developedData = legacy.developed;

      if(rollData || developedData.length){
        state.roll = Number(rollData?.roll) || 24;

        state.raw = Array.isArray(rollData?.raw)
          ? rollData.raw
          : [];

        state.developed = Array.isArray(developedData)
          ? developedData
          : [];

        await saveState();

        toast(
          "Foto lama berhasil dipindahkan ke penyimpanan baru."
        );
      }
    }

    if(rollData){
      state.roll = Number(rollData.roll) || 24;

      state.raw = Array.isArray(rollData.raw)
        ? rollData.raw
        : [];
    }

    if(Array.isArray(developedData)){
      state.developed = developedData;
    }

    $("rollSelect").value = String(state.roll);

    updateCounter();
    renderGallery();
  }

  function toast(message){
    const element = $("toast");

    element.textContent = message;
    element.classList.add("show");

    clearTimeout(toast.timer);

    toast.timer = setTimeout(() => {
      element.classList.remove("show");
    }, 2800);
  }

  function sleep(ms){
    return new Promise(resolve => setTimeout(resolve,ms));
  }

  function dataURLToBlob(dataURL){
    const parts = dataURL.split(",");
    const mime = parts[0].match(/:(.*?);/)[1];
    const binary = atob(parts[1]);
    const array = new Uint8Array(binary.length);

    for(let i = 0; i < binary.length; i++){
      array[i] = binary.charCodeAt(i);
    }

    return new Blob([array],{type:mime});
  }

  function updateCounter(){
    const remaining = Math.max(
      0,
      state.roll - state.raw.length
    );

    $("remaining").textContent = remaining;
    $("rollLabel").textContent = state.roll;

    $("rollFill").style.width =
      `${(remaining / state.roll) * 100}%`;

    $("shutter").disabled =
      state.busy || remaining <= 0;
  }

  function secureMessage(){

  async function startCamera(){
    clearError();

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){
      showError(
        "Browser ini tidak mendukung kamera. " +
        "Silakan upload foto dari galeri."
      );

      return;
    }

    if(state.stream){
      state.stream
        .getTracks()
        .forEach(track => track.stop());
    }

    try{
      state.stream =
        await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:{
              ideal:state.facing
            },
            width:{
              ideal:1280
            },
            height:{
              ideal:960
            }
          },
          audio:false
        });

      video.srcObject = state.stream;
      video.classList.toggle(
        "mirrored",
        state.mirror && state.facing === "user"
      );

      await video.play();

      $("cameraStatus").classList.remove("show");
    }catch(error){
      const denied =
        error &&
        [
          "NotAllowedError",
          "PermissionDeniedError"
        ].includes(error.name);

      showError(
        denied
          ? "Izin kamera ditolak. Izinkan akses kamera di pengaturan browser, atau gunakan Upload dari Galeri."
          : "Kamera tidak tersedia atau sedang digunakan aplikasi lain. Coba tutup aplikasi kamera lain atau gunakan Upload dari Galeri."
      );

      $("cameraStatus").textContent =
        "Kamera tidak aktif — gunakan upload galeri";

      $("cameraStatus").classList.add("show");
    }
  }

  function beep(type = "shutter"){
    if(state.muted){
      return;
    }

    try{
      const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AudioContext){
        return;
      }

      const audio = new AudioContext();
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();

      oscillator.type =
        type === "wind"
          ? "triangle"
          : "square";

      oscillator.frequency.setValueAtTime(
        type === "wind" ? 180 : 900,
        audio.currentTime
      );

      if(type === "wind"){
        oscillator.frequency.exponentialRampToValueAtTime(
          70,
          audio.currentTime + .35
        );
      }else{
        oscillator.frequency.exponentialRampToValueAtTime(
          180,
          audio.currentTime + .08
        );
      }

      gain.gain.setValueAtTime(
        .001,
        audio.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        .2,
        audio.currentTime + .01
      );

      gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime +
          (type === "wind" ? .38 : .12)
      );

      oscillator
        .connect(gain)
        .connect(audio.destination);

      oscillator.start();

      oscillator.stop(
        audio.currentTime +
          (type === "wind" ? .4 : .14)
      );

      setTimeout(() => {
        audio.close().catch(() => {});
      },500);
    }catch(error){
      console.warn("Audio tidak tersedia:",error);
    }
  }

  function doFlash(){
    if(!state.flash){
      return;
    }

    const light = $("flashLight");

    light.classList.remove("fire");

    void light.offsetWidth;

    light.classList.add("fire");
  }

  function getCapture(){
    const width = video.videoWidth || 640;
    const height = video.videoHeight || 480;

    canvas.width = width;
    canvas.height = height;

    ctx.save();

    if(
      state.mirror &&
      state.facing === "user"
    ){
      ctx.translate(width,0);
      ctx.scale(-1,1);
    }

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    ctx.restore();

    /*
     * Kualitas .78 menjaga ukuran file tetap masuk akal
     * untuk IndexedDB dan download.
     */
    return canvas.toDataURL(
      "image/jpeg",
      .78
    );
  }

  function imageFromURL(url){
    return new Promise((resolve,reject) => {
      const image = new Image();

      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = url;
    });
  }

  async function countdown(seconds){
    if(!seconds){
      return;
    }

    for(let i = seconds; i > 0; i--){
      $("cameraStatus").textContent = String(i);
      $("cameraStatus").classList.add("show");

      await sleep(1000);
    }

    $("cameraStatus").classList.remove("show");
  }

  async function takePhoto(silent = false){
    if(state.busy){
      return false;
    }

    if(state.raw.length >= state.roll){
      toast(
        "Roll film sudah habis. Develop dulu ya!"
      );

      return false;
    }

    state.busy = true;
    updateCounter();

    await countdown(
      Number($("countdown").value)
    );

    $("shutter").classList.add("pressed");

    beep("shutter");
    doFlash();

    state.raw.push({
      src:getCapture(),
      created:new Date().toISOString(),
      flash:state.flash
    });

    /*
     * Simpan langsung setelah jepret.
     * Jadi draft roll tidak hilang saat refresh.
     */
    await saveState();

    await sleep(130);

    $("shutter").classList.remove("pressed");

    $("wind").classList.add("spinning");

    beep("wind");

    await sleep(520);

    $("wind").classList.remove("spinning");

    state.busy = false;
    updateCounter();

    if(!silent){
      toast(
        "Foto masuk roll film. Jangan intip dulu 📸"
      );
    }

    return true;
  }

  async function sequence(){
    if(state.busy){
      return;
    }

    const mode = $("mode").value;

    const count =
      mode === "strip" || mode === "grid"
        ? 4
        : 1;

    const available =
      state.roll - state.raw.length;

    if(available < count){
      toast(
        `Foto tersisa tidak cukup untuk mode ini. ` +
        `Mode ini membutuhkan ${count} exposure.`
      );

      return;
    }

    state.busy = true;
    updateCounter();

    for(let i = 0; i < count; i++){
      if(i > 0){
        $("cameraStatus").textContent =
          `Pose ${i + 1}/${count}`;

        $("cameraStatus").classList.add("show");

        await sleep(
          Number($("poseTimer").value) * 1000
        );
      }

      state.busy = false;

      await takePhoto(true);

      state.busy = true;
    }

    $("cameraStatus").classList.remove("show");

    state.busy = false;

    updateCounter();

    toast(
      `${count} pose tersimpan di roll film ✨`
    );
  }

  function addNoise(context,width,height,amount){
    const imageData = context.getImageData(
      0,
      0,
      width,
      height
    );

    const data = imageData.data;

    for(let i = 0; i < data.length; i += 4){
      const noise =
        (Math.random() - .5) * amount;

      data[i] += noise;
      data[i + 1] += noise;
      data[i + 2] += noise;
    }

    context.putImageData(imageData,0,0);
  }

  function applyFilmFilter(context,stock,width,height){
    const imageData = context.getImageData(
      0,
      0,
      width,
      height
    );

    const data = imageData.data;

    for(let i = 0; i < data.length; i += 4){
      let red = data[i];
      let green = data[i + 1];
      let blue = data[i + 2];

      const gray =
        .299 * red +
        .587 * green +
        .114 * blue;

      if(stock === "warm"){
        red = red * 1.08 + 10;
        green = green * .96 + 3;
        blue = blue * .78;
      }

      if(stock === "cool"){
        red = red * .82;
        green = green * 1.05 + 3;
        blue = blue * .98 + 8;
      }

      if(stock === "bw"){
        red = gray * 1.06;
        green = gray * 1.06;
        blue = gray * 1.06;
      }

      if(stock === "expired"){
        red = red * 1.12 + 8;
        green = green * .88;
        blue = blue * .65 + 18;
      }

      if(stock === "pastel"){
        red = red * .94 + 18;
        green = green * .94 + 18;
        blue = blue * .94 + 18;
      }

      const contrast =
        stock === "expired"
          ? 1.13
          : 1.08;

      data[i] = Math.max(
        0,
        Math.min(
          255,
          (red - 128) * contrast + 128
        )
      );

      data[i + 1] = Math.max(
        0,
        Math.min(
          255,
          (green - 128) * contrast + 128
        )
      );

      data[i + 2] = Math.max(
        0,
        Math.min(
          255,
          (blue - 128) * contrast + 128
        )
      );
    }

    context.putImageData(imageData,0,0);
  }

  function drawVignette(context,width,height){
    const gradient =
      context.createRadialGradient(
        width / 2,
        height / 2,
        Math.min(width,height) * .18,
        width / 2,
        height / 2,
        Math.max(width,height) * .72
      );

    gradient.addColorStop(
      0,
      "transparent"
    );

    gradient.addColorStop(
      .68,
      "#00000005"
    );

    gradient.addColorStop(
      1,
      "#160b1688"
    );

    context.fillStyle = gradient;
    context.fillRect(0,0,width,height);
  }

  function drawLightLeak(context,width,height){
    const gradient =
      context.createLinearGradient(
        0,
        0,
        width * .8,
        height
      );

    gradient.addColorStop(
      0,
      "#ff5a5a66"
    );

    gradient.addColorStop(
      .18,
      "#ffd16622"
    );

    gradient.addColorStop(
      .52,
      "transparent"
    );

    gradient.addColorStop(
      1,
      "transparent"
    );

    context.fillStyle = gradient;
    context.fillRect(0,0,width,height);
  }

  function drawTimestamp(context,width,height){
    const text = new Date()
      .toLocaleDateString(
        "id-ID",
        {
          day:"2-digit",
          month:"2-digit",
          year:"2-digit"
        }
      );

    context.font =
      `bold ${Math.max(14,width * .025)}px monospace`;

    context.fillStyle = "#ff6b35";
    context.shadowColor = "#30140a";
    context.shadowBlur = 2;
    context.fillText(
      text,
      width - context.measureText(text).width - 18,
      height - 18
    );

    context.shadowBlur = 0;
  }

  async function addFrame(source,options){
    const image = await imageFromURL(source);

    const mode = options.mode;
    const frame = options.frame;

    let width = image.width;
    let height = image.height;

    if(mode === "strip"){
      width = Math.round(image.width * .72);
      height = Math.round(image.height * .72);
    }

    const border =
      frame === "polaroid" ||
      mode === "polaroid"
        ? Math.round(width * .1)
        : Math.round(width * .055);

    const extraBottom =
      frame === "polaroid" ||
      mode === "polaroid"
        ? border * 1.8
        : 0;

    const output = document.createElement("canvas");

    output.width = width + border * 2;
    output.height =
      height +
      border * 2 +
      extraBottom;

    const context = output.getContext("2d");

    context.fillStyle = options.color;
    context.fillRect(
      0,
      0,
      output.width,
      output.height
    );

    context.drawImage(
      image,
      border,
      border,
      width,
      height
    );

    context.fillStyle = "#241f20";
    context.textAlign = "center";
    context.font =
      `bold ${Math.max(14,width * .035)}px Arial`;

    const defaultLabels = {
      classic:"FILM POP • 35MM",
      polaroid:"",
      korean:"TODAY'S MOOD ✦",
      y2k:"★ DIGITAL DREAM ★",
      newspaper:"THE DAILY SNAP",
      minimal:"",
      cute:"♡ memories ♡"
    };

    const label =
      options.text ||
      defaultLabels[frame] ||
      "";

    if(label){
      context.fillText(
        label,
        output.width / 2,
        output.height - border * .48
      );
    }

    if(frame === "newspaper"){
      context.strokeStyle = "#241f20";
      context.lineWidth = 3;

      context.strokeRect(
        border * .55,
        border * .55,
        output.width - border * 1.1,
        output.height - border * 1.1
      );
    }

    if(frame === "y2k"){
      context.strokeStyle = "#8338ec";
      context.lineWidth = border * .2;

      context.strokeRect(
        border * .45,
        border * .45,
        output.width - border * .9,
        output.height - border * .9
      );
    }

    return output.toDataURL(
      "image/png"
    );
  }

  async function processPhoto(item){
    const image = await imageFromURL(item.src);

    const output = document.createElement("canvas");
    const context = output.getContext("2d");

    output.width = image.width;
    output.height = image.height;

    context.drawImage(
      image,
      0,
      0
    );

    applyFilmFilter(
      context,
      $("stock").value,
      output.width,
      output.height
    );

    if(item.flash){
      const flashGradient =
        context.createRadialGradient(
          output.width / 2,
          output.height / 2,
          2,
          output.width / 2,
          output.height / 2,
          Math.max(
            output.width,
            output.height
          ) * .65
        );

      flashGradient.addColorStop(
        0,
        "#fff8"
      );

      flashGradient.addColorStop(
        .3,
        "transparent"
      );

      flashGradient.addColorStop(
        1,
        "#fff0"
      );

      context.fillStyle = flashGradient;

      context.fillRect(
        0,
        0,
        output.width,
        output.height
      );
    }

    drawLightLeak(
      context,
      output.width,
      output.height
    );

    drawVignette(
      context,
      output.width,
      output.height
    );

    addNoise(
      context,
      output.width,
      output.height,
      18
    );

    drawTimestamp(
      context,
      output.width,
      output.height
    );

    return addFrame(
      output.toDataURL(
        "image/jpeg",
        .82
      ),
      {
        mode:$("mode").value,
        frame:$("frame").value,
        color:$("frameColor").value,
        text:$("frameText").value
      }
    );
  }

  async function makeComposite(sources,mode){
    const images = await Promise.all(
      sources.map(imageFromURL)
    );

    const columns =
      mode === "strip"
        ? 1
        : 2;

    const cellWidth = Math.max(
      ...images.map(image => image.width)
    );

    const cellHeight = Math.max(
      ...images.map(image => image.height)
    );

    const gap = 18;
    const rows = Math.ceil(
      images.length / columns
    );

    const output = document.createElement("canvas");

    output.width =
      columns * cellWidth +
      (columns + 1) * gap;

    output.height =
      rows * cellHeight +
      (rows + 1) * gap;

    const context = output.getContext("2d");

    context.fillStyle =
      $("frameColor").value;

    context.fillRect(
      0,
      0,
      output.width,
      output.height
    );

    images.forEach((image,index) => {
      const x =
        gap +
        (index % columns) *
        (cellWidth + gap);

      const y =
        gap +
        Math.floor(index / columns) *
        (cellHeight + gap);

      context.drawImage(
        image,
        x,
        y,
        cellWidth,
        cellHeight
      );
    });

    return output.toDataURL("image/png");
  }

  async function develop(){
    if(state.busy){
      return;
    }

    if(!state.raw.length){
      toast(
        "Belum ada foto di roll film."
      );

      return;
    }

    state.busy = true;
    updateCounter();

    toast("Sedang develop film…");

    const processed = [];

    for(const item of state.raw){
      processed.push(
        await processPhoto(item)
      );
    }

    const mode = $("mode").value;

    if(mode === "strip" || mode === "grid"){
      const composite =
        await makeComposite(
          processed,
          mode
        );

      state.developed.push({
        src:composite,
        type:mode,
        created:new Date().toISOString()
      });
    }else{
      processed.forEach(src => {
        state.developed.push({
          src,
          type:mode,
          created:new Date().toISOString()
        });
      });
    }

    /*
     * Hapus draft roll setelah berhasil diproses,
     * tetapi hasil develop disimpan ke IndexedDB.
     */
    state.raw = [];

    await saveState();

    renderGallery();

    state.busy = false;
    updateCounter();

    toast(
      "Develop selesai! Hasilnya sudah tersimpan ✨"
    );
  }

  function renderGallery(){
    const gallery = $("gallery");

    gallery.innerHTML = "";

    if(!state.developed.length){
      gallery.innerHTML =
        `<div class="empty">
          Belum ada foto yang di-develop.
          Roll film kamu masih rahasia 🤫
        </div>`;

      return;
    }

    state.developed.forEach((item,index) => {
      const card = document.createElement("div");
      card.className = "card";

      const image = document.createElement("img");
      image.src = item.src;
      image.alt = `Hasil foto ${index + 1}`;
      image.loading = "lazy";

      image.addEventListener(
        "click",
        () => openModal(index)
      );

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const downloadButton =
        document.createElement("button");

      downloadButton.type = "button";
      downloadButton.textContent = "Download";

      downloadButton.addEventListener(
        "click",
        () => download(
          item.src,
          `film-pop-${index + 1}.png`
        )
      );

      const deleteButton =
        document.createElement("button");

      deleteButton.type = "button";
      deleteButton.textContent = "Hapus";

      deleteButton.addEventListener(
        "click",
        async () => {
          state.developed.splice(index,1);

          await saveState();

          renderGallery();

          toast("Foto dihapus.");
        }
      );

      actions.append(
        downloadButton,
        deleteButton
      );

      card.append(
        image,
        actions
      );

      gallery.append(card);
    });
  }

  function download(source,name){
    const link = document.createElement("a");

    link.href = source;
    link.download = name;

    document.body.appendChild(link);
    link.click();
    link.remove();
  }

  function openModal(index){

    $("modalImage").src =
      state.developed[index].src;

    $("modal").classList.add("show");
  }

  function closeModal(){
    $("modal").classList.remove("show");
    state.currentModal = null;

  async function share(source){
    if(!navigator.share){
      toast(
        "Web Share tidak tersedia di browser ini."
      );

      return;
    }

    try{
      const blob = dataURLToBlob(source);

      const file = new File(
        [blob],
        "disposable-photo.png",
        {
          type:"image/png"
        }
      );

      await navigator.share({
        title:"Disposable Camera Photobooth",
        text:"Foto filmku ✨",
        files:[file]
      });
    }catch(error){
      if(error.name !== "AbortError"){
        toast(
          "Foto tidak dapat dibagikan."
        );
      }
    }
  }

  async function resetRoll(){
    if(!state.raw.length){
      toast("Roll film sudah kosong.");
      return;
    }

    const confirmed = confirm(
      "Hapus semua foto yang belum di-develop?"
    );

    if(!confirmed){
      return;
    }

    state.raw = [];

    await saveState();

    updateCounter();

    toast(
      "Roll film dikosongkan."
    );
  }

  $("gridBtn").addEventListener(
    "click",
    () => {
      state.grid = !state.grid;

      $("gridOverlay").classList.toggle(
        "show",
        state.grid
      );

      $("gridBtn").classList.toggle(
        "active",
        state.grid
      );
    }
  );

  $("flashBtn").addEventListener(
    "click",
    () => {
      state.flash = !state.flash;

      $("flashBtn").classList.toggle(
        "active",
        state.flash
      );

      $("flashIndicator").textContent =
        state.flash
          ? "FLASH ON"
          : "FLASH OFF";
    }
  );

  $("muteBtn").addEventListener(
    "click",
    () => {
      state.muted = !state.muted;

      $("muteBtn").textContent =
        state.muted
          ? "🔇 Mute"
          : "🔊 Suara";
    }
  );

  $("uploadBtn").addEventListener(
    "click",
    () => $("uploadInput").click()
  );

  $("uploadInput").addEventListener(
    "change",
    async event => {
      const files = [
        ...event.target.files
      ];

      const remaining =
        state.roll - state.raw.length;

      const acceptedFiles =
        files.slice(0,remaining);

      for(const file of acceptedFiles){
        const reader = new FileReader();

        await new Promise(resolve => {
          reader.onload = () => {
            state.raw.push({
              src:reader.result,
              created:new Date().toISOString(),
              flash:false
            });

            resolve();
          };

          reader.onerror = () => resolve();

          reader.readAsDataURL(file);
        });
      }

      await saveState();

      updateCounter();

      toast(
        `${acceptedFiles.length} foto masuk roll film.`
      );

      event.target.value = "";
    }
  );

  $("rollSelect").addEventListener(
    "change",
    async () => {
      const newRoll = Number(
        $("rollSelect").value
      );

      if(state.raw.length > newRoll){
        toast(
          "Roll baru lebih kecil dari jumlah foto yang sudah tersimpan."
        );

        $("rollSelect").value =
          String(state.roll);

        return;
      }

      state.roll = newRoll;

      await saveState();

      updateCounter();
    }
  );

  $("developBtn").addEventListener(
    "click",
    develop
  );

  $("clearRollBtn").addEventListener(
    "click",
    resetRoll
  );

  $("downloadAll").addEventListener(
    "click",
    () => {
      if(!state.developed.length){
        toast(
          "Belum ada hasil untuk di-download."
        );

        return;
      }

      state.developed.forEach((item,index) => {
        setTimeout(() => {
          download(
            item.src,
            `film-pop-${index + 1}.png`
          );
        },index * 180);
      });
    }
  );

  $("shareAll").addEventListener(
    "click",
    () => {
      if(state.currentModal === null){
        toast(
          "Klik salah satu foto dahulu untuk share."
        );

        return;
      }

      share(
        state.developed[
          state.currentModal
        ].src
      );
    }
  );

  $("closeModal").addEventListener(
    "click",
    closeModal
  );

  $("modal").addEventListener(
    "click",
    event => {
      if(event.target === $("modal")){
        closeModal();
      }
    }
  );

  $("modalDownload").addEventListener(
    "click",
    () => {
      if(state.currentModal === null){
        return;
      }

      download(
        state.developed[
          state.currentModal
        ].src,
        "film-pop-photo.png"
      );
    }
  );

  $("modalShare").addEventListener(
    "click",
    () => {
      if(state.currentModal === null){
        return;
      }

      share(
        state.developed[
          state.currentModal
        ].src
      );
    }
  );

  document.addEventListener(
    "keydown",
    event => {
      if(event.target.matches(
        "input,select,textarea"
      )){
        return;
      }

      if(event.code === "Space"){
        event.preventDefault();
        sequence();
      }

      if(event.key.toLowerCase() === "f"){
        $("flashBtn").click();
      }

      if(event.key.toLowerCase() === "m"){
        $("mirrorBtn").click();
      }

      if(event.key.toLowerCase() === "d"){
        develop();
      }

      if(event.key === "Escape"){
        closeModal();
      }
    }
  );

  window.addEventListener(
    "beforeunload",
    () => {
      if(state.stream){
        state.stream
          .getTracks()
          .forEach(track => track.stop());
      }
    }
  );

  /*
   * Inisialisasi aplikasi.
   */
  secureMessage();

  loadState().catch(error => {
    console.error(
      "Gagal memuat data tersimpan:",
      error
    );

    updateCounter();
    renderGallery();
  });

  startCamera();
})();
</script>
</body>
  </html>
